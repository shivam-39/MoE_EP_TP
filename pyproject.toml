[project]
name = "moe-ep-tp"
version = "0.1.0"
description = "Mixture of Experts with expert-parallel and tensor-parallel MPI communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mpi4py>=4.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-mpi>=0.6",
]

[project.optional-dependencies]
gpu = [
    "torch",
    "triton",
]

[tool.uv]
package = false
